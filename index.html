<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Delicious Move - Match 3</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at center, #24113e 0%, #110521 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #ffffff;
      }

      #game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Top HUD */
      #top-hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        min-height: 86px;
        padding: 10px 24px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 20px;
        background: rgba(20, 9, 36, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 10;
      }

      .hud-top-row {
        display: contents;
      }

      .hud-stats {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .hud-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(255, 255, 255, 0.06);
        padding: 6px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        white-space: nowrap;
      }

      .hud-label {
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 700;
      }

      .hud-value {
        font-size: 22px;
        font-weight: 900;
        color: #ffeb3b;
        text-shadow: 0 2px 8px rgba(255, 235, 59, 0.4);
      }

      .hud-value.global-score-num {
        color: #00e5ff;
        text-shadow: 0 2px 8px rgba(0, 229, 255, 0.4);
      }

      .hud-value.low-moves {
        color: #ff1744;
        animation: pulse 1s infinite;
      }

      .hud-value.frozen-moves {
        color: #00e5ff;
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }

      /* Difficulty and bonus badges */
      .difficulty-badge {
        display: inline-block;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.5px;
        padding: 1px 5px;
        border-radius: 6px;
        text-transform: uppercase;
        vertical-align: middle;
        margin-left: 2px;
      }

      .difficulty-easy {
        background: rgba(0, 230, 118, 0.2);
        color: #00e676;
        border: 1px solid rgba(0, 230, 118, 0.4);
      }

      .difficulty-medium {
        background: rgba(255, 179, 0, 0.2);
        color: #ffb300;
        border: 1px solid rgba(255, 179, 0, 0.4);
      }

      .difficulty-hard {
        background: rgba(255, 87, 34, 0.2);
        color: #ff5722;
        border: 1px solid rgba(255, 87, 34, 0.4);
      }

      .difficulty-very_hard {
        background: rgba(213, 0, 249, 0.25);
        color: #e040fb;
        border: 1px solid rgba(213, 0, 249, 0.5);
        text-shadow: 0 0 6px rgba(224, 64, 251, 0.6);
        animation: pulse 1.5s infinite;
      }

      .moves-bonus-badge {
        display: inline-block;
        font-size: 8px;
        font-weight: 800;
        color: #ffd700;
        background: rgba(255, 215, 0, 0.18);
        border: 1px solid rgba(255, 215, 0, 0.4);
        padding: 1px 4px;
        border-radius: 6px;
        margin-left: 2px;
        vertical-align: middle;
      }

      .moves-frozen-badge {
        display: inline-block;
        font-size: 8px;
        font-weight: 800;
        color: #00e5ff;
        background: rgba(0, 229, 255, 0.2);
        border: 1px solid rgba(0, 229, 255, 0.45);
        padding: 1px 5px;
        border-radius: 6px;
        margin-left: 3px;
        vertical-align: middle;
        letter-spacing: 0.3px;
      }

      .moves-bonus-badge.hidden,
      .moves-frozen-badge.hidden,
      .bonus-phase-badge.hidden {
        display: none;
      }

      .bonus-phase-badge {
        display: inline-block;
        font-size: 9px;
        font-weight: 900;
        color: #ffd700;
        background: linear-gradient(90deg, rgba(0, 229, 255, 0.25), rgba(255, 215, 0, 0.25));
        border: 1px solid rgba(255, 215, 0, 0.6);
        box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        padding: 2px 8px;
        border-radius: 12px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        animation: pulse 1.5s infinite;
      }

      /* Progress Bar */
      .progress-container {
        flex: 1;
        max-width: 360px;
        margin: 0 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        width: 100%;
      }

      .score-box {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .target-box {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }

      .progress-num {
        font-size: 15px;
        font-weight: 900;
        color: #ffffff;
      }

      .progress-track {
        width: 100%;
        height: 14px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
      }

      #progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ff007f, #ff9100, #00e676);
        border-radius: 8px;
        transition: width 0.3s ease;
        box-shadow: 0 0 10px rgba(255, 145, 0, 0.6);
      }

      #progress-fill.bonus-phase-glow {
        background: linear-gradient(90deg, #00e5ff, #ffd700, #ff007f) !important;
        box-shadow: 0 0 14px rgba(255, 215, 0, 0.8) !important;
      }

      /* Sound Button */
      .hud-top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #sound-toggle-btn,
      #debug-toggle-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        font-size: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s ease, background 0.2s ease;
      }

      #sound-toggle-btn:hover,
      #debug-toggle-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: scale(1.05);
      }

      #sound-toggle-btn:active,
      #debug-toggle-btn:active {
        transform: scale(0.95);
      }

      /* Mobile layout adaptations (Pixel 10 Pro & portrait phones) */
      @media (max-width: 600px) {
        #top-hud {
          min-height: 108px;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          padding: 8px 12px 10px;
          gap: 8px;
        }

        .hud-top-row {
          display: flex;
          width: 100%;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
        }

        .hud-stats {
          gap: 6px;
        }

        .hud-card {
          padding: 4px 12px;
          border-radius: 10px;
        }

        .hud-label {
          font-size: 10px;
        }

        .hud-value {
          font-size: 18px;
        }

        .progress-container {
          max-width: 100%;
          margin: 0;
        }

        .progress-header {
          font-size: 12px;
        }

        #sound-toggle-btn,
        #debug-toggle-btn {
          width: 38px;
          height: 38px;
          font-size: 18px;
        }
      }

      /* Debug Overlay */
      #debug-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(8, 4, 16, 0.88);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 150;
        padding: 16px;
      }

      #debug-overlay.hidden {
        display: none !important;
      }

      .debug-panel {
        background: #180a2b;
        border: 2px solid rgba(255, 215, 0, 0.5);
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.9);
        border-radius: 16px;
        width: 680px;
        max-width: 96%;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .debug-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        background: rgba(255, 255, 255, 0.05);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        flex-wrap: wrap;
        gap: 8px;
      }

      .debug-header h3 {
        font-size: 15px;
        font-weight: 800;
        color: #ffd700;
      }

      .debug-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .dbg-btn {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        padding: 5px 10px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .dbg-btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .dbg-btn-warn {
        background: rgba(255, 152, 0, 0.25);
        border-color: rgba(255, 152, 0, 0.6);
        color: #ffb74d;
      }

      .dbg-btn-danger {
        background: rgba(244, 67, 54, 0.25);
        border-color: rgba(244, 67, 54, 0.6);
        color: #ef5350;
      }

      .debug-content {
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        font-size: 12px;
      }

      .dbg-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      @media (max-width: 600px) {
        .dbg-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .dbg-card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 10px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .dbg-label {
        font-size: 9px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        font-weight: 700;
      }

      .dbg-val {
        font-size: 13px;
        font-weight: 700;
        color: #e0e0e0;
      }

      .dbg-warn {
        color: #ff9800;
      }

      .dbg-danger {
        color: #f44336;
      }

      .dbg-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .dbg-section-title {
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 0.5px;
      }

      .dbg-table-wrap {
        overflow-x: auto;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
      }

      .dbg-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        text-align: left;
      }

      .dbg-table th, .dbg-table td {
        padding: 6px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        white-space: nowrap;
      }

      .dbg-table th {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.7);
        font-weight: 700;
      }

      .dbg-action {
        display: inline-block;
        font-size: 9px;
        padding: 1px 4px;
        border-radius: 4px;
        font-weight: 800;
      }

      .dbg-swap { background: rgba(33, 150, 243, 0.2); color: #64b5f6; }
      .dbg-activate { background: rgba(156, 39, 176, 0.25); color: #ba68c8; }
      .dbg-shuffle { background: rgba(255, 152, 0, 0.25); color: #ffb74d; }
      .dbg-victory { background: rgba(76, 175, 80, 0.25); color: #81c784; }
      .dbg-game_over { background: rgba(244, 67, 54, 0.25); color: #e57373; }

      .dbg-ascii {
        background: #0d0418;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 8px 12px;
        font-family: monospace;
        font-size: 11px;
        line-height: 1.35;
        color: #a7ffeb;
        overflow-x: auto;
      }

      /* Modal Overlay */
      #game-modal {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 4, 18, 0.85);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        transition: opacity 0.3s ease;
      }

      #game-modal.hidden {
        display: none !important;
      }

      .modal-box {
        background: linear-gradient(145deg, rgba(38, 17, 68, 0.95), rgba(20, 8, 38, 0.95));
        border: 2px solid rgba(255, 215, 0, 0.4);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.2);
        border-radius: 24px;
        padding: 36px 48px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        max-width: 90%;
        width: 380px;
      }

      #modal-title {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 0.5px;
      }

      #modal-final-score {
        font-size: 30px;
        font-weight: 900;
        color: #ffeb3b;
        text-shadow: 0 2px 8px rgba(255, 235, 59, 0.4);
      }

      .modal-scores-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        width: 100%;
      }

      .modal-score-card {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 10px 18px;
        min-width: 120px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .modal-score-caption {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.6);
      }

      .modal-score-caption.caption-cyan {
        color: #00e5ff;
      }

      #modal-global-score.score-cyan {
        font-size: 26px;
        font-weight: 900;
        color: #00e5ff;
        text-shadow: 0 2px 10px rgba(0, 229, 255, 0.5);
      }

      #modal-detail {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.75);
        line-height: 1.4;
      }

      #modal-action-btn {
        background: linear-gradient(90deg, #ff007f, #ff7b00);
        border: none;
        outline: none;
        color: white;
        font-weight: 800;
        font-size: 17px;
        padding: 14px 32px;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }

      #modal-action-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
      }

      #modal-action-btn:active {
        transform: scale(0.97);
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        z-index: 1;
      }
      #language-toggle-btn, #new-game-btn {
        border: 1px solid #ffffff33; border-radius: 10px; padding: 8px 10px;
        background: #ffffff12; color: #fff; font: inherit; font-size: 12px; cursor: pointer;
      }
      #new-game-btn:disabled { opacity: 0.45; cursor: default; }
      #save-status { color: #b9aaca; font-size: 11px; width: 100%; text-align: right; }
      #save-status[data-warning="true"] { color: #ffe082; }
      .hud-top-actions { flex-wrap: wrap; }
      #top-hud { flex-wrap: wrap; height: auto; }
      @media (max-width: 700px) {
        .hud-top-row { flex-wrap: wrap; gap: 8px; }
        .hud-top-actions { justify-content: flex-end; width: 100%; }
        .hud-stats { width: 100%; justify-content: space-between; }
        .hud-card { min-width: 0; padding: 4px 6px; }
        .hud-label { font-size: 9px; letter-spacing: 0; }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <header id="top-hud">
        <div class="hud-top-row">
          <div class="hud-stats">
            <div class="hud-card" id="level-card">
              <span class="hud-label"><span data-i18n="level">Level</span> <span id="difficulty-badge" class="difficulty-badge difficulty-easy">EASY</span></span>
              <span id="level-value" class="hud-value">1</span>
            </div>
            <div class="hud-card" id="global-score-card" data-i18n-title="globalTip" title="Total score accumulated across all levels">
              <span class="hud-label" data-i18n="globalScore">Global Score</span>
              <span id="global-score-value" class="hud-value global-score-num">0</span>
            </div>
            <div class="hud-card" id="moves-card" data-i18n-title="movesTip" title="Unused moves from cleared levels accumulate here!">
              <span class="hud-label"><span data-i18n="moves">Moves</span> <span id="moves-bonus-badge" class="moves-bonus-badge hidden">+0</span><span data-i18n="frozen" id="moves-frozen-badge" class="moves-frozen-badge hidden">❄️ FROZEN</span></span>
              <span id="moves-value" class="hud-value">25</span>
            </div>
            <div class="hud-card" data-i18n-title="shufflesTip" title="Rescue reshuffles left this level">
              <span class="hud-label" data-i18n="shuffles">Shuffles</span>
              <span id="shuffles-value" class="hud-value">4</span>
            </div>
          </div>
          <div class="hud-top-actions">
            <button id="language-toggle-btn" data-i18n-title="languageTip" title="Change language (L)" aria-label="Change language (L)">ES</button>
            <button id="new-game-btn" data-i18n="newGame">New Game</button>
            <button id="sound-toggle-btn" data-i18n-title="soundTip" title="Toggle Sound">🔊</button>
            <button id="debug-toggle-btn" data-i18n-title="debugTip" title="Toggle Debug / Telemetry (or press `)">🐞</button>
          </div>
        </div>

        <div class="progress-container">
          <div class="progress-header">
            <div class="score-box">
              <span class="hud-label" data-i18n="score">Score</span>
              <strong id="score-value" class="progress-num">0</strong>
            </div>
            <div data-i18n="bonus" id="bonus-phase-indicator" class="bonus-phase-badge hidden">BONUS PHASE ❄️</div>
            <div class="target-box">
              <span class="hud-label" data-i18n="target">Min Target</span>
              <strong id="target-value" class="progress-num">4,000</strong>
            </div>
          </div>
          <div class="progress-track">
            <div id="progress-fill"></div>
          </div>
        </div>
        <div id="save-status" role="status" aria-live="polite"></div>
      </header>

      <div id="game-modal" class="hidden">
        <div class="modal-box">
          <h2 id="modal-title">SWEET VICTORY!</h2>
          <p id="modal-detail">Level cleared.</p>
          <div class="modal-scores-row">
            <div class="modal-score-card">
              <span class="modal-score-caption" data-i18n="finalScore">Level Score</span>
              <p id="modal-final-score">0</p>
            </div>
            <div id="modal-global-container" class="modal-score-card hidden">
              <span class="modal-score-caption caption-cyan" data-i18n="globalScore">Global Score</span>
              <p id="modal-global-score" class="score-cyan">0</p>
            </div>
          </div>
          <button id="modal-action-btn">Play Again</button>
        </div>
      </div>

      <!-- Diagnostic & Telemetry Overlay -->
      <div id="debug-overlay" class="hidden">
        <div class="debug-panel">
          <div class="debug-header">
            <h3 data-i18n="diagnostics">🐞 Game Diagnostics & Telemetry</h3>
            <div class="debug-actions">
              <button data-i18n="copy" id="debug-btn-copy" class="dbg-btn" data-i18n-title="copyTip" title="Copy full JSON report">📋 Copy Report</button>
              <button data-i18n="unlock" id="debug-btn-unlock" class="dbg-btn dbg-btn-warn" data-i18n-title="unlockTip" title="Emergency unlock for frozen input">🔓 Unlock Input</button>
              <button data-i18n="reshuffle" id="debug-btn-shuffle" class="dbg-btn" data-i18n-title="reshuffleTip" title="Force board reshuffle">🔀 Reshuffle</button>
              <button id="debug-btn-close" class="dbg-btn dbg-btn-danger" data-i18n-title="close" title="Close overlay">✖</button>
            </div>
          </div>
          <div id="debug-overlay-content" class="debug-content"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
