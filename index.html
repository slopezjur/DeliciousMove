<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Delicious Move - Match 3</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at center, #24113e 0%, #110521 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #ffffff;
      }

      #game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Top HUD */
      #top-hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 86px;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(20, 9, 36, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 10;
      }

      .hud-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(255, 255, 255, 0.06);
        padding: 6px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .hud-label {
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 700;
      }

      .hud-value {
        font-size: 22px;
        font-weight: 900;
        color: #ffeb3b;
        text-shadow: 0 2px 8px rgba(255, 235, 59, 0.4);
      }

      .hud-value.low-moves {
        color: #ff1744;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }

      /* Progress Bar */
      .progress-container {
        flex: 1;
        max-width: 320px;
        margin: 0 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 600;
      }

      .progress-track {
        width: 100%;
        height: 14px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
      }

      #progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ff007f, #ff9100, #00e676);
        border-radius: 8px;
        transition: width 0.3s ease;
        box-shadow: 0 0 10px rgba(255, 145, 0, 0.6);
      }

      /* Sound Button */
      #sound-toggle-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        font-size: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s ease, background 0.2s ease;
      }

      #sound-toggle-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: scale(1.05);
      }

      #sound-toggle-btn:active {
        transform: scale(0.95);
      }

      /* Modal Overlay */
      #game-modal {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 4, 18, 0.85);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        transition: opacity 0.3s ease;
      }

      #game-modal.hidden {
        display: none;
      }

      .modal-box {
        background: linear-gradient(145deg, rgba(38, 17, 68, 0.95), rgba(20, 8, 38, 0.95));
        border: 2px solid rgba(255, 215, 0, 0.4);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.2);
        border-radius: 24px;
        padding: 36px 48px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        max-width: 90%;
        width: 380px;
      }

      #modal-title {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 0.5px;
      }

      #modal-final-score {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.85);
      }

      #modal-action-btn {
        background: linear-gradient(90deg, #ff007f, #ff7b00);
        border: none;
        outline: none;
        color: white;
        font-weight: 800;
        font-size: 17px;
        padding: 14px 32px;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }

      #modal-action-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
      }

      #modal-action-btn:active {
        transform: scale(0.97);
      }

      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <header id="top-hud">
        <div class="hud-card">
          <span class="hud-label">Moves</span>
          <span id="moves-value" class="hud-value">25</span>
        </div>

        <div class="progress-container">
          <div class="progress-header">
            <span>Score: <strong id="score-value">0</strong></span>
            <span>Target: <strong id="target-value">4,000</strong></span>
          </div>
          <div class="progress-track">
            <div id="progress-fill"></div>
          </div>
        </div>

        <button id="sound-toggle-btn" title="Toggle Sound">🔊</button>
      </header>

      <div id="game-modal" class="hidden">
        <div class="modal-box">
          <h2 id="modal-title">SWEET VICTORY!</h2>
          <p id="modal-final-score">Final Score: 0</p>
          <button id="modal-action-btn">Play Again</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
