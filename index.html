<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Delicious Move - Match 3</title>
    <link rel="stylesheet" href="/src/styles/game.css" />
  </head>
  <body>
    <div id="game-container">
      <header id="top-hud">
        <div class="game-heading">
          <div class="level-heading" id="level-card">
            <span class="hud-label" data-i18n="level">Level</span>
            <span id="level-value" class="hud-value">1</span>
            <span id="difficulty-badge" class="difficulty-badge difficulty-easy">EASY</span>
          </div>
          <div class="bonus-slot" role="status" aria-live="polite"><button id="bonus-phase-indicator" class="bonus-info-button hidden" aria-haspopup="dialog" aria-controls="bonus-info-dialog" data-i18n-aria-label="bonus" data-i18n-title="bonus"><span data-i18n="bonusShort">Bonus</span> ⓘ</button></div>
          <button id="settings-toggle-btn" class="icon-button" aria-haspopup="dialog" aria-controls="settings-dialog" data-i18n-aria-label="settings" data-i18n-title="settings">⚙</button>
        </div>
        <section class="gameplay-stats">
          <div class="hud-card" id="moves-card" data-i18n-title="movesTip">
            <span class="hud-label" data-i18n="levelMoves">Level moves</span>
            <span id="moves-value" class="hud-value">25</span>
            <div id="bank-moves" class="bank-moves"><span data-i18n="bankMoves">Bank</span> <strong id="bank-moves-value">0</strong></div>
          </div>
          <div class="progress-container">
            <div class="progress-header">
              <div class="score-box">
                <span class="hud-label" data-i18n="score">Score</span>
                <strong id="score-value" class="progress-num">0</strong>
              </div>
              <div class="target-box" id="score-target-box">
                <span class="hud-label" data-i18n="target">Min Target</span>
                <strong id="target-value" class="progress-num">4,000</strong>
              </div>
            </div>
            <div class="progress-track"><div id="progress-fill"></div></div>
          </div>
          <p id="objectives-instruction" class="feature-hint hidden" data-i18n="allRequired"></p>
          <div id="objectives-list" class="objective-list hidden" role="status" aria-live="polite" aria-atomic="true"></div>
          <p id="level-feature-hint" class="feature-hint hidden"></p>
        </section>
        <footer class="run-summary">
          <div class="lives-row"><span class="hud-label" data-i18n="lives">Lives</span><strong id="lives-value">♥ 5/5</strong><span id="lives-timer"></span></div>
          <p id="resources-warning" class="records-warning hidden" role="status"></p>
          <div class="secondary-stats">
            <div class="summary-stat" id="global-score-card" data-i18n-title="globalTip">
              <span class="hud-label" data-i18n="globalScore">Global Score</span>
              <span id="global-score-value" class="hud-value global-score-num">0</span>
            </div>
            <div class="summary-stat" data-i18n-title="shufflesTip">
              <span class="hud-label" data-i18n="shuffles">Shuffles</span>
              <span id="shuffles-value" class="hud-value">4</span>
            </div>
          </div>
          <div class="personal-records" data-i18n-title="recordsTip">
            <div class="summary-stat"><span class="hud-label" data-i18n="bestLevel">Best level cleared</span><strong id="best-level-value">0</strong></div>
            <div class="summary-stat"><span class="hud-label" data-i18n="bestScore">Best total score</span><strong id="best-score-value">0</strong></div>
          </div>
          <p id="records-status" class="records-warning hidden" role="status"></p>
          <div id="save-status" role="status" aria-live="polite"></div>
        </footer>
      </header>
      <div id="board-viewport"></div>
      <dialog id="bonus-info-dialog" aria-labelledby="bonus-info-title">
        <div class="settings-heading"><h2 id="bonus-info-title" data-i18n="bonus">BONUS ROUND</h2><button id="bonus-info-close" class="icon-button" data-i18n-aria-label="close">✕</button></div>
        <p data-i18n="bonusExplanation"></p>
      </dialog>
      <dialog id="settings-dialog" aria-labelledby="settings-title">
        <div class="settings-heading">
          <h2 id="settings-title" data-i18n="settings">Settings</h2>
          <button id="settings-close-btn" class="icon-button" data-i18n-aria-label="close">✕</button>
        </div>
        <div class="settings-row">
          <label for="language-select" data-i18n="language">Language</label>
          <select id="language-select" data-i18n-title="languageTip">
            <option value="en" lang="en">English</option>
            <option value="es" lang="es">Español</option>
          </select>
        </div>
        <div class="settings-row">
          <span data-i18n="sound">Sound</span>
          <button id="sound-toggle-btn" data-i18n-title="soundTip">On</button>
        </div>
        <p id="save-detail"></p>
        <details class="feature-help">
          <summary data-i18n="featureHelp">Board guide</summary>
          <p data-i18n="hintJelly"></p>
          <p data-i18n="hintIce"></p>
          <p data-i18n="hintBlockers"></p>
          <p data-i18n="hintShape"></p>
          <p data-i18n="hintIngredients"></p>
          <p data-i18n="hintChocolate"></p>
        </details>
        <div class="settings-actions">
          <button id="debug-toggle-btn" data-i18n="diagnostics">🐞 Game Diagnostics &amp; Telemetry</button>
          <button id="new-game-btn" data-i18n="newGame">New Game</button>
        </div>
      </dialog>

      <div id="game-modal" class="hidden">
        <div class="modal-box">
          <h2 id="modal-title">SWEET VICTORY!</h2>
          <p id="modal-detail">Level cleared.</p>
          <div class="modal-scores-row">
            <div class="modal-score-card">
              <span class="modal-score-caption" data-i18n="finalScore">Level Score</span>
              <p id="modal-final-score">0</p>
            </div>
            <div id="modal-global-container" class="modal-score-card hidden">
              <span class="modal-score-caption caption-cyan" data-i18n="globalScore">Global Score</span>
              <p id="modal-global-score" class="score-cyan">0</p>
            </div>
          </div>
          <button id="modal-action-btn">Play Again</button>
        </div>
      </div>

      <!-- Diagnostic & Telemetry Overlay -->
      <div id="debug-overlay" class="hidden">
        <div class="debug-panel">
          <div class="debug-header">
            <h3 data-i18n="diagnostics">🐞 Game Diagnostics & Telemetry</h3>
            <div class="debug-actions">
              <button data-i18n="copy" id="debug-btn-copy" class="dbg-btn" data-i18n-title="copyTip" title="Copy full JSON report">📋 Copy Report</button>
              <button data-i18n="unlock" id="debug-btn-unlock" class="dbg-btn dbg-btn-warn" data-i18n-title="unlockTip" title="Emergency unlock for frozen input">🔓 Unlock Input</button>
              <button data-i18n="reshuffle" id="debug-btn-shuffle" class="dbg-btn" data-i18n-title="reshuffleTip" title="Force board reshuffle">🔀 Reshuffle</button>
              <button id="debug-btn-close" class="dbg-btn dbg-btn-danger" data-i18n-title="close" title="Close overlay">✖</button>
            </div>
          </div>
          <div id="debug-overlay-content" class="debug-content"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
